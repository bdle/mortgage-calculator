name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main # Triggers workflow on push to main branch
      - feature/*
  workflow_dispatch:
# Grant permissions required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.set-url.outputs.host_url }}
    runs-on: ubuntu-latest
    outputs:
      host_url: ${{ steps.set-url.outputs.host_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build
      
     # Deploy MAIN to root (preserves existing preview folders)
      - name: Deploy Production (Main)
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: . # Deploys directly to root
          clean: false     # Keeps existing preview/* folders intact

      - name: Prepare Preview Folder Name
        if: github.ref != 'refs/heads/main'
        id: preview-path
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          CLEAN_NAME="${BRANCH_NAME#feature/}"
          echo "folder_name=${CLEAN_NAME}" >> "$GITHUB_OUTPUT"

      # Deploy FEATURE branch to subdirectory
      - name: Deploy Feature Preview
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: preview/${{ steps.preview-path.outputs.folder_name }}
          clean: false
          
      - name: Set Target Deployment URL Output
        id: set-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "host_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          else
            # Strip "feature/" prefix to prevent deep directory nesting
            CLEAN_BRANCH="${{ github.ref_name }}"
            CLEAN_BRANCH="${CLEAN_BRANCH#feature/}"
            echo "host_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/${CLEAN_BRANCH}/" >> "$GITHUB_OUTPUT"
          fi

  run-cypress-test:
    needs: [build-and-deploy]
    uses: bdle/cy-mortgage-calulator/.github/workflows/reusable_workflow.yml@main
    secrets: inherit
    with:
      url: ${{ needs.build-and-deploy.outputs.host_url }}
      test_suite: 'tier1'
      dispatcher_text: 'Atto Mattic from mortgage-calculator repo'
  
