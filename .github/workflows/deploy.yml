name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main # Triggers workflow on push to main branch
      - feature/*
  workflow_dispatch:
# Grant permissions required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.set-url.outputs.host_url }}
    runs-on: ubuntu-latest
    outputs:
      host_url: ${{ steps.set-url.outputs.host_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
      
     # Deploy MAIN to root (preserves existing preview folders)
      - name: Deploy Production (Main)
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: . # Deploys directly to root
          clean: false     # Keeps existing preview/* folders intact

      # Deploy FEATURE branch to subdirectory (preserves main production root)
      - name: Deploy Feature Preview
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: preview/${{ github.ref_name }} # Deploys to preview/feature/...
          clean: false     # Keeps root main files and other previews intact
          
      - name: Set Target Deployment URL Output
        id: set-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "host_url=${{ steps.deployment.outputs.host_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "host_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"
          fi

  run-cypress-test:
    needs: [build-and-deploy]
    uses: bdle/cy-mortgage-calulator/.github/workflows/reusable_workflow.yml@main
    secrets: inherit
    with:
      url: ${{ needs.build-and-deploy.outputs.host_url }}
      test_suite: 'tier1'
      dispatcher_text: 'Atto Mattic from mortgage-calculator repo'
  
  package-sent-jfrog:
    needs: [run-cypress-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
      # 4. Package build folder into a .zip bundle
      - name: Compress Build Artifact
        run: |
          zip -r mortgage-calculator-v${{ github.run_number }}.zip dist/

      # 5. Setup official JFrog CLI
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # 6. Upload build artifact to Artifactory Generic Repository
      - name: Upload Artifact to JFrog
        run: |
          jf rt upload mortgage-calculator-v${{ github.run_number }}.zip mortgage-calculator-builds/